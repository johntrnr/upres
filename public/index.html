<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Upres</title>
<meta name="description" content="Tiled creative upscaler: cloud diffusion and on-device Real-ESRGAN.">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Upres">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed image viewport; pipeline tab strip + one control panel docked below (phone) or as a right inspector (desktop). Monochrome by intent. */
:root{
  --bg:#0a0a0a;
  --raise:#121212;
  --raise-2:#1a1a1a;
  --raise-3:#252525;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  --fg:#ededed;
  --fg-2:#a3a3a3;
  --fg-3:#6b6b6b;
  --ink:#0a0a0a;
  --f-sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar" "view" "dock"}
@media (min-width:960px){
  .app{grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar" "view dock"}
  .dock{border-top:0!important;border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  .dock .tabs{order:-1;border-bottom:1px solid var(--line);border-top:0!important;flex-wrap:wrap;overflow:visible;row-gap:2px;padding-block:4px}
  .dock .panel{max-height:none!important}
}

/* bar */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;height:52px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.word{font-weight:600;font-size:16px;letter-spacing:-.01em}
.status{color:var(--fg-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.status b{color:var(--fg-2);font-weight:500}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--fg-2);flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
.ib:hover{background:var(--raise-2);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--raise-3);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu[open] summary{background:var(--raise-3);color:var(--fg)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:40;background:var(--raise-2);border:1px solid var(--line-2);border-radius:14px;min-width:260px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.7);max-height:70vh;overflow:auto}
.pop h6{margin:0;padding:10px 10px 6px;font:500 11px var(--f-sans);color:var(--fg-3);letter-spacing:.02em}
.pop button{width:100%;text-align:left;padding:9px 10px;border-radius:9px;display:grid;gap:1px}
.pop button:hover{background:var(--raise-3)}
.pop button span{font-weight:500}
.pop button small{color:var(--fg-3);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* viewport */
.view{grid-area:view;position:relative;overflow:hidden;touch-action:none;background:#060606;cursor:grab;min-height:0}
.view.grabbing{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 0 0 1px var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.px canvas{image-rendering:pixelated}
#gridSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#gridSvg rect{fill:transparent;stroke:rgba(255,255,255,.22);stroke-width:1;vector-effect:non-scaling-stroke}
#gridSvg rect.q{fill:rgba(6,6,6,.45)}
#gridSvg rect.a{stroke:#fff;stroke-width:1.5;fill:rgba(255,255,255,.06)}
#gridSvg rect.d{stroke:rgba(255,255,255,.08)}
#gridSvg rect.p{stroke:#fff;stroke-width:1.5;stroke-dasharray:5 4}
.hud{position:absolute;z-index:4;display:flex;gap:6px;align-items:center}
.hud.bl{left:max(12px, env(safe-area-inset-left,0px));bottom:12px}
.hud.br{right:max(12px, env(safe-area-inset-right,0px));bottom:12px}
.hud.tc{left:50%;top:12px;transform:translateX(-50%)}
.chip{background:rgba(10,10,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:500 11px var(--f-mono);color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
button.chip:hover{color:var(--fg)}
.chip.load{display:flex;gap:8px;align-items:center;color:var(--fg)}
.spin{width:11px;height:11px;border:1.5px solid var(--line-2);border-top-color:var(--fg);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{position:absolute;top:12px;z-index:4;font:500 11px var(--f-sans);color:var(--fg);background:rgba(10,10,10,.72);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.tag.l{left:max(12px, env(safe-area-inset-left,0px))}.tag.r{right:max(12px, env(safe-area-inset-right,0px))}
.split{position:absolute;top:0;bottom:0;width:48px;margin-left:-24px;z-index:3;cursor:ew-resize;display:flex;justify-content:center;touch-action:none}
.split::before{content:"";width:1.5px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.5)}
.split i{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.split i::before{content:"";width:10px;height:10px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;background:transparent}
.prog i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;background:var(--raise-3);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:12.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.drop{position:absolute;inset:10px;border:1.5px dashed var(--fg-2);border-radius:16px;display:grid;place-items:center;font-weight:500;background:rgba(10,10,10,.6);z-index:7}

/* dock */
.dock{grid-area:dock;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel{overflow:auto;max-height:min(40vh,380px);padding-block:16px 18px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overscroll-behavior:contain}
.panel.collapsed{display:none}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.ph div{flex:1;min-width:0}
.ph h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--fg-3);font-size:12.5px;line-height:1.4}
.sec{display:grid;gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px));flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:grid;gap:1px;text-align:left;padding:10px 10px 9px;position:relative;min-width:0}
.tab .t{font-size:12.5px;font-weight:500;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.tab .s{font:400 11px var(--f-mono);color:var(--fg-3);white-space:nowrap}
.tab .dot{width:5px;height:5px;border-radius:50%;background:var(--fg-2)}
.tab.off .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--fg-3)}
.tab.off .t{color:var(--fg-3)}
.tab[aria-selected="true"] .t{color:var(--fg)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:1.5px;background:var(--fg);border-radius:1px}
.tabs .chev{flex:none;align-self:center;color:var(--fg-3);font-size:11px;padding:0 1px;opacity:.6}
.actions{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding-block:10px 12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));flex:none}
@media (min-width:960px){.actions{border-top:1px solid var(--line)}}
.btn{height:46px;border-radius:12px;padding:0 16px;font-weight:500;font-size:14px;background:var(--raise-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--raise-3)}
.btn:disabled{opacity:.35;cursor:default;background:var(--raise-2)}
.btn.pri{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:600}
.btn.pri:hover{background:#fff}
.btn.sq{width:46px;padding:0}
.btn.sm{height:36px;border-radius:10px;font-size:13px;padding:0 12px}

/* controls */
.w{display:grid;gap:8px;min-width:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--fg-2);user-select:none;-webkit-user-select:none}
.lab output{font:500 12px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.w.mod .lab span::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--fg-2);margin-left:6px;vertical-align:middle}
.hint{color:var(--fg-3);font-size:11.5px;line-height:1.4;margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;touch-action:pan-y;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--p,50%),var(--raise-3) var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;background:var(--raise-3);border-radius:2px}
input[type=range]::-moz-range-progress{height:2px;background:var(--fg);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:42px;height:32px;padding:0 10px;border-radius:8px;color:var(--fg-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--raise-3);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px var(--line-2)}
select.sel{width:100%;height:38px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:13px;appearance:auto}
.cards{display:grid;gap:6px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise)}
.card span{font-weight:500;font-size:13.5px}
.card small{display:block;color:var(--fg-3);font-size:12px;margin-top:1px}
.card i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fg-3)}
.card[aria-checked="true"]{background:var(--raise-2);border-color:var(--line-2)}
.card[aria-checked="true"] i{box-shadow:inset 0 0 0 5px var(--fg)}
.sw{position:relative;width:42px;height:26px;border-radius:13px;background:var(--raise-3);flex:none;transition:background .15s;box-shadow:inset 0 0 0 1px var(--line-2)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg-2);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--fg)}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--fg-2)}
.seed{display:flex;gap:6px}
.seed input{flex:1;min-width:0;height:36px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:500 12.5px var(--f-mono)}
.src{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.src img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--raise-2);display:block;border:1px solid var(--line)}
.src .nm{font-weight:500;word-break:break-all;line-height:1.3}
.src .dm{color:var(--fg-3);font:400 11.5px var(--f-mono);margin-top:2px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
textarea{width:100%;min-height:68px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.4}
textarea::placeholder{color:var(--fg-3)}
.box a{color:var(--fg);text-underline-offset:2px}
.ok{color:var(--fg)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--raise)}
.box h4{margin:0;font-size:13px;font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;color:var(--fg-3)}
.facts dd{margin:0;color:var(--fg-2);font-family:var(--f-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.ai{border-left:1.5px solid var(--fg-2);padding-left:10px;font-size:12.5px;color:var(--fg-2)}
.ai b{display:block;color:var(--fg);font-weight:600;margin-bottom:1px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px, env(safe-area-inset-left,0px))}
.sheet img{flex:1;min-height:0;width:100%;object-fit:contain}
.sheet p{margin:0;text-align:center;color:var(--fg-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="word">Upres</span>
    <span class="status" id="status" aria-live="polite">Ready</span>
    <button class="ib" id="bBefore" title="Hold to see the original" aria-label="Hold to see the original"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ib" id="bSplit" aria-pressed="false" title="Split before / after" aria-label="Split before and after"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
    <details class="menu" id="menu">
      <summary class="ib" aria-label="Presets and workflow"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></summary>
      <div class="pop" id="menuPop"></div>
    </details>
  </header>

  <section class="view" id="view" aria-label="Image viewport">
    <div class="stage" id="stage">
      <canvas id="srcCv"></canvas>
      <canvas id="outCv" hidden></canvas>
      <svg id="gridSvg" preserveAspectRatio="none"></svg>
    </div>
    <div class="split" id="split" hidden><i></i></div>
    <span class="tag l" id="tagB" hidden>Before</span>
    <span class="tag r" id="tagA" hidden>After</span>
    <div class="hud tc" id="hudLoad" hidden><span class="chip load"><span class="spin"></span><span id="loadTxt">Loading model</span></span></div>
    <div class="hud bl"><span class="chip" id="hudDims"></span></div>
    <div class="hud br"><button class="chip" id="hudZoom" title="Double-tap the image to toggle fit / 100%">Fit</button></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="toast" id="toast" hidden></div>
    <div class="drop" id="drop" hidden>Drop image to load</div>
  </section>

  <section class="dock" aria-label="Pipeline">
    <div class="panel" id="panel"></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Pipeline steps"></nav>
    <div class="actions">
      <button class="btn" id="bPreview" title="Render the tile at the centre of the view">Preview</button>
      <button class="btn pri" id="bRun">Upscale</button>
      <button class="btn sq" id="bSave" disabled title="Save image" aria-label="Save image"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    </div>
  </section>
</div>

<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="wfIn" accept="application/json,.json" hidden>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Upscaled result">
  <p>Press and hold the image to save it.</p>
  <button class="btn pri" id="sheetClose">Close</button>
</div>

<script type="text/js-worker" id="workerSrc">
let S=null,SW=0,SH=0;
self.onmessage=function(e){
  const m=e.data;
  if(m.type==='src'){S=new Uint8ClampedArray(m.buf);SW=m.w;SH=m.h;return;}
  if(m.type==='job'){
    try{
      const out=processTile(m.job,m.p);
      self.postMessage({type:m.test?'test':'tile',run:m.run,job:m.job,buf:out.buffer},[out.buffer]);
    }catch(err){
      self.postMessage({type:'error',run:m.run,job:m.job,test:!!m.test,message:String(err&&err.message||err)});
    }
  }
};

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){return (vnoise(x,y,s)*0.55+vnoise(x*2.03+5.1,y*2.03+1.7,s+17)*0.3+vnoise(x*4.11+9.3,y*4.11+3.2,s+31)*0.15)*2-1;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const KERN={
  lanczos:{s:3,k:x=>{if(x===0)return 1;if(x<=-3||x>=3)return 0;const px=Math.PI*x;return 3*Math.sin(px)*Math.sin(px/3)/(px*px);}},
  bicubic:{s:2,k:x=>{x=Math.abs(x);const a=-0.5;if(x<1)return (a+2)*x*x*x-(a+3)*x*x+1;if(x<2)return a*x*x*x-5*a*x*x+8*a*x-4*a;return 0;}},

async function ensureNet(){

  if(NN.busy)await NN.busy.catch(()=>{});
  if(NN.net&&NN.key===key)return NN.net;
  NN.busy=(async()=>{
    setLoad('Loading TensorFlow.js');const tf=await loadTF();
    let w;
    if(key==='anime')w=await loadWeights('anime','anime model');
    else{const d=+P.model.dni,a=await loadWeights('gen','general model'),b=await loadWeights('wdn','detail model');w=new Float32Array(a.length);for(let i=0;i<a.length;i++)w[i]=a[i]*d+b[i]*(1-d);}
    setLoad('Compiling GPU shaders');
    if(NN.net)NN.net.dispose();
    NN.net=build(tf,ARCH(key==='anime'?16:32),w);NN.key=key;
    const t=tf.zeros([1,16,16,3]),y=NN.net.run(t);await y.data();t.dispose();y.dispose();
    setLoad(null);updateStatus();
    return NN.net;
  })();
  try{return await NN.busy;}catch(e){setLoad(null);throw e;}finally{NN.busy=null;}
}
async function infer(tile,g){
  const s=g.ow/g.sw,M=g.margin;
  const rx0=Math.max(0,tile.x-M),ry0=Math.max(0,tile.y-M),rx1=Math.min(g.ow,tile.x+tile.w+M),ry1=Math.min(g.oh,tile.y+tile.h+M);
  const sx0=Math.max(0,Math.floor(rx0/s)-PAD),sy0=Math.max(0,Math.floor(ry0/s)-PAD),sx1=Math.min(g.sw,Math.ceil(rx1/s)+PAD),sy1=Math.min(g.sh,Math.ceil(ry1/s)+PAD);
  const w=sx1-sx0,h=sy1-sy0,d=WORK.data.data,W=WORK.w,arr=new Float32Array(w*h*3);
  for(let y=0,k=0;y<h;y++){let i=((sy0+y)*W+sx0)*4;for(let x=0;x<w;x++,i+=4){arr[k++]=d[i]/255;arr[k++]=d[i+1]/255;arr[k++]=d[i+2]/255;}}
  const tf=NN.tf,x=tf.tensor4d(arr,[1,h,w,3]),y=NN.net.run(x);x.dispose();
  const out=await y.data();y.dispose();
  return {buf:out.buffer,w:w*4,h:h*4,ox:sx0*4,oy:sy0*4,k:s/4};
}

const Z={z:1,tx:0,ty:0,fit:1,atFit:true};
function shown(){if(RUN)return RUN.geo;if(OUT&&OUT.ow===geo.ow&&OUT.oh===geo.oh)return OUT;return geo;}
function csize(){const g=shown(),d=devicePixelRatio||1;return {w:g.ow/d,h:g.oh/d};}
function vrect(){return {w:view.clientWidth,h:view.clientHeight};}
function fitView(){if(!geo)return;const r=vrect(),c=csize(),pad=r.w<600?12:28;Z.fit=Math.max(.01,Math.min((r.w-pad*2)/c.w,(r.h-pad*2)/c.h));Z.z=Z.fit;Z.atFit=true;Z.tx=(r.w-c.w*Z.z)/2;Z.ty=(r.h-c.h*Z.z)/2;applyZ();}
function clampZ(){const r=vrect(),c=csize(),W=c.w*Z.z,H=c.h*Z.z;Z.tx=W<=r.w?(r.w-W)/2:Math.min(0,Math.max(r.w-W,Z.tx));Z.ty=H<=r.h?(r.h-H)/2:Math.min(0,Math.max(r.h-H,Z.ty));}
function zoomAt(nz,cx,cy){nz=Math.max(Math.min(Z.fit,1),Math.min(8,nz));const k=nz/Z.z;Z.tx=cx-(cx-Z.tx)*k;Z.ty=cy-(cy-Z.ty)*k;Z.z=nz;Z.atFit=Math.abs(nz-Z.fit)<1e-3;clampZ();applyZ();}
function applyZ(){
  if(!geo)return;const c=csize();
  stage.style.width=c.w+'px';stage.style.height=c.h+'px';
  stage.style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.z})`;
  const g=shown(),dpr=devicePixelRatio||1,cssPerSrc=(c.w*Z.z)/geo.sw;

}
const ptrs=new Map();let gest=null,lastTap=0;
const rel=e=>{const r=view.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
view.addEventListener('pointerdown',e=>{
  if(e.target.closest('.hud,.split,.toast'))return;
  view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===1){const p=rel(e);gest={t:'pan',sx:p.x,sy:p.y,tx:Z.tx,ty:Z.ty,moved:false};view.classList.add('grabbing');}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest={t:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:Z.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:Z.tx,ty:Z.ty};}
});
view.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,rel(e));
  if(gest&&gest.t==='pan'&&ptrs.size===1){const p=rel(e),dx=p.x-gest.sx,dy=p.y-gest.sy;if(Math.abs(dx)+Math.abs(dy)>4)gest.moved=true;Z.tx=gest.tx+dx;Z.ty=gest.ty+dy;clampZ();applyZ();}
  else if(gest&&gest.t==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const nz=Math.max(Math.min(Z.fit,1),Math.min(8,gest.z0*d/gest.d0)),k=nz/gest.z0;Z.z=nz;Z.tx=mx-(gest.mx-gest.tx)*k;Z.ty=my-(gest.my-gest.ty)*k;Z.atFit=Math.abs(nz-Z.fit)<1e-3;clampZ();applyZ();}
});
const endPtr=e=>{

  if(gest&&gest.t==='pan'&&!gest.moved&&ptrs.size===0){const now=performance.now();if(now-lastTap<320){lastTap=0;if(Z.z>Z.fit*1.05)fitView();else zoomAt(Math.max(1,Z.fit*2.5),p.x,p.y);}else lastTap=now;}
  if(ptrs.size===1){const q=[...ptrs.values()][0];gest={t:'pan',sx:q.x,sy:q.y,tx:Z.tx,ty:Z.ty,moved:true};}else if(ptrs.size===0){gest=null;view.classList.remove('grabbing');}
};
view.addEventListener('pointerup',endPtr);view.addEventListener('pointercancel',endPtr);
view.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);zoomAt(Z.z*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),p.x,p.y);},{passive:false});

let PV=null;
async function previewCloud(){
  if(!tok()){UI.tab='model';UI.collapsed=false;saveUI();renderPanel();syncTabs();toast('Paste your Replicate token in Model to use diffusion.');return;}
  geo=computeGeo();ensureWork();const g=geo;
  const r=vrect(),c=csize();
  const cx=(r.w/2-Z.tx)/Z.z/c.w*g.sw,cy=(r.h/2-Z.ty)/Z.z/c.h*g.sh;
  const side=Math.min(g.sw,g.sh,320),x0=Math.round(Math.max(0,Math.min(g.sw-side,cx-side/2))),y0=Math.round(Math.max(0,Math.min(g.sh-side,cy-side/2)));
  const run=RUN={id:++runSeq,geo:g,t0:performance.now(),cancel:false,st:{},total:0,drawIdx:0,cloud:true,preview:true};
  beginRunUI();
  try{
    const img=await encodeInput(srcCv,x0,y0,side,side);
    const res=await cloudRun(run,img,g.eff);
    if(RUN!==run)return;
    status('<b>Downloading</b> preview');
    const bmp=await loadRemote(res.output[res.output.length-1]);
    if(RUN!==run)return;
    RUN=null;resetRunBtn();
    if(!(OUT&&OUT.ow===g.ow&&OUT.oh===g.oh)){outCv.width=g.ow;outCv.height=g.oh;OUT={ow:g.ow,oh:g.oh,full:false};}
    const k=g.ow/g.sw,ctx=outCv.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(bmp,x0*k,y0*k,side*k,side*k);
    previewRect={x:Math.round(x0*k),y:Math.round(y0*k),w:Math.round(side*k),h:Math.round(side*k)};
    $('#prog').style.width='0';refresh();
    toast('Preview crop rendered with diffusion. Local steps are not applied to previews.');
  }catch(e){if(RUN===run){RUN=null;resetRunBtn();$('#prog').style.width='0';refresh();}if(e&&e.message!=='cancelled')toast(e.message||'Preview failed.');}
}
async function preview(){
  if(RUN||!IMG)return;
  if(DIFF(P.model.method))return previewCloud();
  geo=computeGeo();ensureWork();const g=geo;
  const r=vrect(),c=csize(),d=devicePixelRatio||1;
  const cx=((r.w/2-Z.tx)/Z.z)*d*(g.ow/(c.w*d)),cy=((r.h/2-Z.ty)/Z.z)*d*(g.oh/(c.h*d));
  let t=null,bd=1e18;for(const x of g.tiles){const dd=Math.hypot(x.x+x.w/2-cx,x.y+x.h/2-cy);if(dd<bd){bd=dd;t=x;}}
  const btn=$('#bPreview');btn.disabled=true;$('#bRun').disabled=true;
  try{
    status('<b>Preview</b> · rendering one tile');
    let patch=null;
    if(NEURAL(P.model.method)){await ensureNet();patch=await infer(t,g);}
    ensurePool();
    const res=await new Promise(res=>{PV=(m,err)=>{PV=null;res(m?{m}:{err});};const job=Object.assign({noRamp:true},t);if(patch)job.patch=patch;pool[0].load++;pool[0].postMessage({type:'job',test:true,run:0,job,p:jobParams(g)},patch?[patch.buf]:[]);});
    if(res.err)throw new Error(res.err);
    if(!(OUT&&OUT.ow===g.ow&&OUT.oh===g.oh)){outCv.width=g.ow;outCv.height=g.oh;OUT={ow:g.ow,oh:g.oh,full:false};}
    drawTileBuf(outCv.getContext('2d'),t,res.m.buf);
    previewRect={x:t.x,y:t.y,w:t.w,h:t.h};
    refreshOut();drawGrid();updateStatus();
    toast('Tile '+(t.id+1)+' rendered. Pan elsewhere and preview again, or run Upscale.');
  }catch(e){toast('Preview failed: '+(e.message||e));updateStatus();}
  finally{btn.disabled=false;$('#bRun').disabled=false;}
}
$('#bPreview').addEventListener('click',preview);

/* ---------- save ---------- */
let dlCap;const getDl=async()=>{if(dlCap!==undefined)return dlCap;try{dlCap=window.claude&&claude.use?await claude.use('downloads'):null;}catch{dlCap=null;}return dlCap;};
async function saveImage(){
  if(!(OUT&&OUT.full))return;
  const f=P.stitch.format,type=f==='png'?'image/png':f==='jpg'?'image/jpeg':'image/webp';
  const blob=await new Promise(r=>outCv.toBlob(r,type,P.stitch.quality));
  if(!blob){toast('This browser cannot encode '+f.toUpperCase()+'. Try PNG.');return;}
  const name=`${(IMG.name||'upres').slice(0,40)}_x${+OUT.eff.toFixed(2)}_${OUT.seed}.${f}`;
  const dl=await getDl();
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return;}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('A save prompt is already open.');return;}}}
  try{const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Saved '+name);return;}catch{}
  $('#sheetImg').src=URL.createObjectURL(blob);$('#sheet').hidden=false;
}
$('#bSave').addEventListener('click',saveImage);
$('#sheetClose').addEventListener('click',()=>{$('#sheet').hidden=true;URL.revokeObjectURL($('#sheetImg').src);});

/* ---------- menu ---------- */
function buildMenu(){
  const pop=$('#menuPop');
  pop.innerHTML='<h6>Presets</h6>'+PRESETS.map((p,i)=>`<button data-i="${i}"><span>${p.name}</span><small>${p.d}</small></button>`).join('')+'<hr><h6>Workflow</h6><button data-a="export"><span>Export workflow</span><small>All step settings as .json</small></button><button data-a="import"><span>Import workflow</span><small>Load a .json exported here</small></button><button data-a="reset"><span>Reset all steps</span><small>Back to defaults</small></button>';
  pop.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;$('#menu').open=false;
    if(b.dataset.i!==undefined){const pr=PRESETS[+b.dataset.i],keep={seed:P.creative.seed,seedMode:P.creative.seedMode,grid:P.tiles.grid,st:clone(P.stitch),max:P.model.maxSide,fit:P.model.fit};P=merge(DEF,pr.p);P.creative.seed=keep.seed;P.creative.seedMode=keep.seedMode;P.tiles.grid=keep.grid;P.stitch=keep.st;P.model.maxSide=keep.max;P.model.fit=keep.fit;applyAll();toast(pr.name);if(NEURAL(P.model.method))warmModel();}
    else if(b.dataset.a==='reset'){P=clone(DEF);applyAll();toast('All steps reset.');}
    else if(b.dataset.a==='import')$('#wfIn').click();
    else if(b.dataset.a==='export'){const data=JSON.stringify({app:'Upres',version:2,steps:P},null,2);const dl=await getDl();
      if(dl){try{await dl.save({filename:'upres-workflow.json',data});toast('Workflow saved.');}catch(e){if(e?.code!=='declined')toast('Saving files is not available here.');}}
      else{try{await navigator.clipboard.writeText(data);toast('Workflow JSON copied.');}catch{toast('Saving files is not available here.');}}}
  });
  document.addEventListener('click',e=>{if($('#menu').open&&!e.target.closest('#menu'))$('#menu').open=false;});
}
$('#wfIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());P=merge(DEF,j.steps||j.nodes||j);applyAll();toast('Workflow loaded.');}catch{toast('That file is not an Upres workflow.');}});
function applyAll(){save();renderPanel();refresh();}

/* ---------- Claude auto-tune ---------- */
const INTENT={sample:null,last:null,ctl:null};
function schemaText(){const L=[];for(const s of STEPS){if(s.bypass)L.push(`${s.id}.on: true | false`);for(const w of s.widgets||[]){if(w.ai===false)continue;if(w.type==='range')L.push(`${s.id}.${w.k}: number ${w.min}..${w.max} (${w.label}${w.hint?'; '+w.hint:''})`);else L.push(`${s.id}.${w.k}: one of ${w.options.map(o=>JSON.stringify(o[0])).join(', ')} (${w.label||'model'}${w.type==='cards'?'; '+w.options.map(o=>o[0]+' = '+o[2]).join('; '):''})`);}}return L.join('\n');}
function applyAI(params){const ch=[];for(const s of STEPS){const src=params&&params[s.id];if(!src||typeof src!=='object')continue;if(s.bypass&&typeof src.on==='boolean'&&P[s.id].on!==src.on){P[s.id].on=src.on;ch.push(s.id);}for(const w of s.widgets||[]){if(w.ai===false||!(w.k in src))continue;let v=src[w.k];if(w.type==='range'){v=Number(v);if(!isFinite(v))continue;v=+Math.min(w.max,Math.max(w.min,Math.round(v/w.step)*w.step)).toFixed(4);}else{const o=w.options.find(o=>String(o[0])===String(v));if(!o)continue;v=o[0];}if(P[w.g||s.id][w.k]!==v){P[w.g||s.id][w.k]=v;ch.push(s.id+'.'+w.k);}}}return ch;}
function showAI(){const o=$('#aiOut');if(!o||!INTENT.last)return;o.innerHTML='';const d=document.createElement('div');d.className='ai';const b=document.createElement('b');b.textContent=INTENT.last.name;const t=document.createElement('div');t.textContent=INTENT.last.note;d.append(b,t);o.appendChild(d);}
async function autoTune(){
  const s=INTENT.sample;if(!s||!IMG)return;const b=$('#bTune'),st=$('#bTuneStop'),o=$('#aiOut');
  b.disabled=true;st.hidden=false;o.innerHTML='<div class="hint">Claude is looking at the image…</div>';
  const c=document.createElement('canvas'),k=Math.min(1,1024/Math.max(IMG.w,IMG.h));c.width=Math.round(IMG.w*k);c.height=Math.round(IMG.h*k);c.getContext('2d').drawImage(IMG.src,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const intent=$('#intent').value.trim()||'Best high-quality upscale: faithful, clean, sharp, with tasteful texture.';
  const prompt=`You are tuning a tiled image upscaler that runs on a phone. Step order: model (Real-ESRGAN neural x4 or classic filter) -> tiles -> enhance -> color -> creative (procedural texture re-synthesis per tile) -> export.
The attached image is the input (downsized for you; the original is ${IMG.w}x${IMG.h}px).
User intent: ${JSON.stringify(intent)}

Choose settings that suit the content and the intent. Prefer the neural models for real photos and illustration. Keep strengths moderate unless the intent asks for something stylised.
Reply with only JSON: {"name":"2-3 word look name","note":"one short sentence on what you chose and why","params":{"model":{...},"tiles":{...},"enhance":{...},"modify":{...},"creative":{...}}}
Include only keys you want to set. Allowed keys:
${schemaText()}`;
  INTENT.ctl=new AbortController();
  try{const res=await s.json(prompt,{images:[blob],signal:INTENT.ctl.signal,cache:false});const ch=applyAI(res&&res.params);INTENT.last={name:String(res?.name||'Claude tune').slice(0,40),note:String(res?.note||'').slice(0,240)+(ch.length?` (${ch.length} settings changed)`:' (no changes)')};save();refresh();renderTabs();showAI();toast('Tuned. Preview a tile or run Upscale.');if(NEURAL(P.model.method))warmModel();}
  catch(e){const m={cancelled:'Stopped.',not_granted:'Claude access was not allowed for this page.',rate_limited:'Too many requests right now. Try again in a minute.',invalid_json:'Claude replied in an unexpected format. Try again.',image_rejected:'This image could not be sent.',refused:'Claude declined this request. Try different wording.'}[e?.code]||'Auto-tune failed. Try again.';o.innerHTML=`<div class="hint">${m}</div>`;
    if(['not_granted','sampling_disabled','images_unavailable','capability_disabled','capability_removed','not_declared'].includes(e?.code)){INTENT.sample=null;const bx=$('#intentBox');if(bx)bx.hidden=true;}}
  finally{b.disabled=false;st.hidden=true;INTENT.ctl=null;}
}
(async()=>{if(!window.claude||!claude.use)return;try{const s=await claude.use('sample');if(!s)return;const l=await s.limits().catch(()=>null);if(!l||!l.images)return;INTENT.sample=s;const bx=$('#intentBox');if(bx)bx.hidden=false;}catch{}})();

/* ---------- misc ---------- */
let tT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3400);}
let warmT=0;function warmModel(){clearTimeout(warmT);warmT=setTimeout(()=>{if(!RUN&&NEURAL(P.model.method))ensureNet().then(()=>{refreshFacts();updateStatus();}).catch(e=>toast('Neural model unavailable here: '+(e.message||e)));},400);}
addEventListener('resize',()=>syncTabs());

buildMenu();renderTabs();
setImage(makeSample(),'night-run',true);
renderPanel();
if(NEURAL(P.model.method))setTimeout(warmModel,600);
if(DIFF(P.model.method)&&tok())connectCloud(false);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
